<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap');

  #compact-results .cr-cat-eco .cr-category-header { background: #2d5016; }
  #compact-results .cr-cat-wor .cr-category-header { background: #5c3a1a; }
  #compact-results .cr-cat-cul .cr-category-header { background: #4a1a5c; }
  #compact-results .cr-category-body { padding: 8px 10px; background: #faf8f4; border: 1px solid #c0b8a8; border-top: none; }
  #compact-results .cr-sub { margin-bottom: 7px; }

  #compact-results .cr-policy::before { content: "—"; position: absolute; left: 0; color: #8b0000; }

<div class="container">

    <h1>Saved Profiles</h1>
    <div class="subtitle">Your stored political spectrum results</div>
  </div>

  <!-- LIST VIEW -->

    <div id="profile-list"></div>
    <div class="import-section" id="import-section" style="display: none;">
      <input type="file" id="import-file" accept=".json" onchange="handleImport(event)" />

<script>
const policiesDB = {};

let profiles = [];
let selectedIndex = -1;

function init() {
  try { profiles = JSON.parse(localStorage.getItem('politicalSpectrumProfiles') || '[]'); }
  catch(e) { profiles = []; }
  renderList();
}

function renderList() {
  const list = document.getElementById('profile-list');
  const importSection = document.getElementById('import-section');
  importSection.style.display = profiles.length > 0 ? 'block' : 'block';

  if (profiles.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <h2>No Saved Profiles Yet</h2>
        <p>Complete the quiz and save your results to see them here.</p>
        <a href="what-you-stand-for.html" class="btn btn-view" style="text-decoration: none;">Take the Quiz</a>
      </div>`;
    return;
  }

  let html = '';

  if (profiles.length >= 2) {
    html += `<div class="compare-section">
      <h3>Compare Two Profiles</h3>
      <select class="compare-select" id="compare-a">`;
    profiles.forEach((p, i) => { html += `<option value="${i}">${p.label} (${formatDate(p.timestamp)})</option>`; });
    html += `</select> vs <select class="compare-select" id="compare-b">`;
    profiles.forEach((p, i) => { html += `<option value="${i}"${i === 1 ? ' selected' : ''}>${p.label} (${formatDate(p.timestamp)})</option>`; });
    html += `</select> <button class="btn btn-view" onclick="compareProfiles()">Compare</button></div>`;
  }

  profiles.forEach((profile, index) => {
    const policyCount = countPolicies(profile.answers);
    html += `
      <div class="profile-card">
        <div class="profile-info">
          <div class="profile-name">${escapeHtml(profile.label)}</div>
          <div class="profile-date">${formatDate(profile.timestamp)}</div>
          <div class="profile-count">${policyCount} policies selected</div>
        </div>
        <div class="profile-actions">
          <button class="btn btn-export" onclick="exportProfile(${index})">Export</button>
          <button class="btn btn-view" onclick="viewProfile(${index})">View</button>
          <button class="btn btn-edit" onclick="editProfile(${index})">Edit</button>
          <button class="btn btn-delete" onclick="deleteProfile(${index})">Delete</button>
        </div>
      </div>`;
  });

  list.innerHTML = html;
}

function countPolicies(answers) {
  let count = 0;
  Object.values(answers).forEach(p => { if (Array.isArray(p)) count += p.length; });
  return count;
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ========== EXPORT ==========
function exportProfile(index) {
  const profile = profiles[index];
  const data = JSON.stringify(profile, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeName = profile.label.replace(/[^a-z0-9]/gi, '_').toLowerCase();
  const date = new Date(profile.timestamp).toISOString().slice(0, 10);
  a.href = url;
  a.download = `political-spectrum-${safeName}-${date}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ========== IMPORT ==========
function handleImport(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      // Validate structure
      if (!imported.label || !imported.answers || !imported.timestamp) {
        alert('Invalid profile file. Missing required fields (label, answers, timestamp).');
        return;
      }
      // Add to profiles
      profiles.push(imported);
      localStorage.setItem('politicalSpectrumProfiles', JSON.stringify(profiles));
      renderList();
      alert('Profile "' + imported.label + '" imported successfully!');
    } catch(err) {
      alert('Failed to parse file. Make sure it is a valid exported profile (.json).');
    }
  };
  reader.readAsText(file);
  // Reset input so same file can be imported again
  event.target.value = '';
}

// ========== VIEW ==========
function viewProfile(index) {
  selectedIndex = index;
  const profile = profiles[index];

  document.getElementById('list-view').style.display = 'none';
  document.getElementById('compare-view').style.display = 'none';
  document.getElementById('detail-view').style.display = 'block';

  document.getElementById('detail-delete-btn').onclick = function() { deleteProfile(index); };

  const db = profile.resolvedPolicies || policiesDB;
  renderProfileResults(profile, db);
}

function loadPoliciesDB() {
  const merged = {};
  profiles.forEach(p => { if (p.resolvedPolicies) Object.assign(merged, p.resolvedPolicies); });
  if (Object.keys(merged).length === 0) Object.assign(merged, policiesDB);
  return Promise.resolve(merged);
}

function renderProfileResults(profile, db) {
  const answers = profile.answers;
  let allPolicies = [];
  Object.values(answers).forEach(p => { if (Array.isArray(p)) allPolicies.push(...p); });
  allPolicies = [...new Set(allPolicies)];

  const hasResolved = profile.resolvedPolicies && Object.keys(profile.resolvedPolicies).length > 0;
  const hasPolicies = allPolicies.length > 0;

  const grouped = {};
  let missingCount = 0;
  allPolicies.forEach(key => {
    const p = db[key];
    if (!p) { missingCount++; return; }
    if (!grouped[p.category]) grouped[p.category] = {};
    if (!grouped[p.category][p.subcategory]) grouped[p.category][p.subcategory] = [];
    grouped[p.category][p.subcategory].push({ key, ...p });
  });

  // Add abstained subcategories from saved profile
  if (profile.abstainedSubcategories) {
    profile.abstainedSubcategories.forEach(a => {
      if (!grouped[a.category]) grouped[a.category] = {};
      if (!grouped[a.category][a.subcategory]) grouped[a.category][a.subcategory] = [];
      if (!grouped[a.category][a.subcategory].some(p => p.key === a.key)) {
        grouped[a.category][a.subcategory].push({ key: a.key, description: a.description });
      }
    });
  }

  const catOrder = ["Governance", "Economy", "World", "Culture & Social Issues"];
  const catCss = { "Governance": "results-cat-governance", "Economy": "results-cat-economy", "World": "results-cat-world", "Culture & Social Issues": "results-cat-culture" };

  // Results image section
  let html = `
    <div class="results-header">
      <div class="results-label">${escapeHtml(profile.label)}</div>
      <h2>Political Profile</h2>
      <div class="results-date">${formatDate(profile.timestamp)}</div>
    </div>
    <div class="results-image-section" id="results-image-section">
      <img id="results-image" alt="Results Summary" />
      <br />
      <a id="btn-download-image" class="btn btn-view" style="font-size: 0.9em; padding: 10px 25px; text-decoration: none;">Download Results Image</a>
      <div style="margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;">
        <label style="font-size: 0.85em; color: var(--text-light); font-weight: 600;">Image theme:</label>
        <select id="image-theme-select" onchange="rerenderEditorImage(this.value)" style="font-family: 'Playfair Display', Georgia, serif; font-size: 0.85em; padding: 6px 12px; border: 2px solid var(--border-light); background: var(--card-bg); color: var(--text); cursor: pointer; border-radius: 3px;">
          <option value="current">Current theme</option>
          <option value="sepia">Sepia</option>
          <option value="dark">Dark</option>
          <option value="cold">Cold</option>
          <option value="ink">Ink &amp; Ivory</option>
          <option value="rosewood">Rosewood</option>
          <option value="lavender">Lavender</option>
          <option value="telegraph">Telegraph</option>
          <option value="forest">Forest</option>
          <option value="sandstone">Sandstone</option>
        </select>
        <label style="font-size: 0.85em; color: var(--text-light); font-weight: 600; margin-left: 10px;">Quality:</label>
        <select id="image-quality-select" onchange="rerenderEditorImage(document.getElementById('image-theme-select').value)" style="font-family: 'Playfair Display', Georgia, serif; font-size: 0.85em; padding: 6px 12px; border: 2px solid var(--border-light); background: var(--card-bg); color: var(--text); cursor: pointer; border-radius: 3px;">
          <option value="1">Low</option>
          <option value="1.5">Medium</option>
          <option value="2" selected>High</option>
        </select>
      </div>
    </div>`;

  if (hasPolicies && !hasResolved) {
    html += `<div style="background: #fff3cd; border: 1px solid #ffc107; padding: 15px; margin-bottom: 20px; font-size: 0.9em;">
      ⚠️ This profile was saved before the current version and is missing detailed policy data.
      Only ${allPolicies.length - missingCount} of ${allPolicies.length} policies can be displayed.
      <br><strong>To fix:</strong> Retake the quiz and save again with the same name.
    </div>`;
  }

  catOrder.forEach(catName => {
    const catData = grouped[catName] || {};
    const subs = Object.keys(catData);
    html += `<div class="results-category ${catCss[catName]}"><div class="results-category-header">${catName}</div><div class="results-category-body">`;
    if (subs.length === 0) { html += `<div class="no-policies">No policies selected.</div>`; }
    else {
      subs.forEach(sub => {
        html += `<div class="results-subcategory"><div class="results-subcategory-title">${sub}</div>`;
        catData[sub].forEach(p => {
          html += `<div class="policy-card" onclick="this.classList.toggle('open')"><div class="policy-card-header"><div class="policy-symbol">${p.symbol || '⬡'}</div><div class="policy-name">${p.key}</div><div class="policy-arrow">▼</div></div><div class="policy-description">${p.description}</div></div>`;
        });
        html += `</div>`;
      });
    }
    html += `</div></div>`;
  });

  document.getElementById('detail-content').innerHTML = html;
  window.scrollTo(0, 0);

  // Generate compact image
  generateProfileImage(profile, grouped);
}

let lastEditorGrouped = null;
let lastEditorProfile = null;

function applyThemeToCompact(themeName) {
  const el = document.getElementById('compact-results');
  if (!el) return;
  if (themeName === 'current') {
    const cs = getComputedStyle(document.documentElement);
    el.style.background = cs.getPropertyValue('--bg').trim();
    el.style.color = cs.getPropertyValue('--text').trim();
    el.querySelectorAll('.cr-category-header').forEach(h => h.style.background = '');
    el.querySelectorAll('.cr-category').forEach(c => {
      if (c.classList.contains('cr-cat-gov')) c.querySelector('.cr-category-header').style.background = cs.getPropertyValue('--cat-governance').trim();
      if (c.classList.contains('cr-cat-eco')) c.querySelector('.cr-category-header').style.background = cs.getPropertyValue('--cat-economy').trim();
      if (c.classList.contains('cr-cat-wor')) c.querySelector('.cr-category-header').style.background = cs.getPropertyValue('--cat-world').trim();
      if (c.classList.contains('cr-cat-cul')) c.querySelector('.cr-category-header').style.background = cs.getPropertyValue('--cat-culture').trim();
    });
    el.querySelector('.cr-header').style.borderTopColor = cs.getPropertyValue('--border').trim();
    el.querySelector('.cr-header').style.borderBottomColor = cs.getPropertyValue('--border').trim();
    el.querySelectorAll('.cr-category-body').forEach(b => { b.style.background = cs.getPropertyValue('--card-bg').trim(); b.style.borderColor = cs.getPropertyValue('--border-light').trim(); });
    el.querySelectorAll('.cr-sub-title').forEach(t => { t.style.color = cs.getPropertyValue('--text').trim(); t.style.borderBottomColor = cs.getPropertyValue('--border-light').trim(); });
    el.querySelectorAll('.cr-policy').forEach(p => p.style.color = cs.getPropertyValue('--text-light').trim());
    el.querySelectorAll('.cr-empty').forEach(p => p.style.color = cs.getPropertyValue('--text-light').trim());
    el.querySelector('.cr-footer').style.borderTopColor = cs.getPropertyValue('--border').trim();
    el.querySelector('.cr-footer').style.color = cs.getPropertyValue('--text-light').trim();
    if (el.querySelector('.cr-header p')) el.querySelector('.cr-header p').style.color = cs.getPropertyValue('--text-light').trim();
    return;
  }
  const t = imageThemes[themeName];
  if (!t) return;
  el.style.background = t.bg;
  el.style.color = t.text;
  el.querySelector('.cr-header').style.borderTopColor = t.border;
  el.querySelector('.cr-header').style.borderBottomColor = t.border;
  if (el.querySelector('.cr-header p')) el.querySelector('.cr-header p').style.color = t.textLight;
  el.querySelectorAll('.cr-category-body').forEach(b => { b.style.background = t.cardBg; b.style.borderColor = t.borderLight; });
  el.querySelectorAll('.cr-sub-title').forEach(st => { st.style.color = t.text; st.style.borderBottomColor = t.borderLight; });
  el.querySelectorAll('.cr-policy').forEach(p => p.style.color = t.textLight);
  el.querySelectorAll('.cr-empty').forEach(p => p.style.color = t.textLight);
  el.querySelector('.cr-footer').style.borderTopColor = t.border;
  el.querySelector('.cr-footer').style.color = t.textLight;
  el.querySelectorAll('.cr-category').forEach(c => {
    const h = c.querySelector('.cr-category-header');
    if (c.classList.contains('cr-cat-gov')) h.style.background = t.gov;
    if (c.classList.contains('cr-cat-eco')) h.style.background = t.eco;
    if (c.classList.contains('cr-cat-wor')) h.style.background = t.wor;
    if (c.classList.contains('cr-cat-cul')) h.style.background = t.cul;
  });
}

function rerenderEditorImage(themeName) {
  applyThemeToCompact(themeName);
  const el = document.getElementById('compact-results');
  const qualitySelect = document.getElementById('image-quality-select');
  const scale = qualitySelect ? parseFloat(qualitySelect.value) : 2;
  setTimeout(() => {
    if (typeof html2canvas === 'undefined') return;
    html2canvas(el, { scale: scale, backgroundColor: el.style.background || '#f5f0e8', useCORS: true }).then(canvas => {
      const imgData = canvas.toDataURL('image/png');
      document.getElementById('results-image').src = imgData;
      const btn = document.getElementById('btn-download-image');
      btn.href = imgData;
      btn.download = `political-spectrum-${(lastEditorProfile ? lastEditorProfile.label : 'results').replace(/[^a-z0-9]/gi, '_').toLowerCase()}.png`;
    });
  }, 100);
}

function generateProfileImage(profile, grouped) {
  lastEditorProfile = profile;
  lastEditorGrouped = grouped;
  const el = document.getElementById('compact-results');
  const catOrder = ["Governance", "Economy", "World", "Culture & Social Issues"];
  const catCss = { "Governance": "cr-cat-gov", "Economy": "cr-cat-eco", "World": "cr-cat-wor", "Culture & Social Issues": "cr-cat-cul" };

  // Add abstained subcategories to grouped (for image)
  if (profile.abstainedSubcategories) {
    profile.abstainedSubcategories.forEach(a => {
      if (!grouped[a.category]) grouped[a.category] = {};
      if (!grouped[a.category][a.subcategory]) grouped[a.category][a.subcategory] = [];
      if (!grouped[a.category][a.subcategory].some(p => p.key === a.key)) {
        grouped[a.category][a.subcategory].push({ key: a.key });
      }
    });
  }

  // Add "Not answered" for questions without answers AND not abstained (image only)
  if (profile.questionMeta && Array.isArray(profile.questionMeta)) {
    const answers = profile.answers || {};
    const abstained = profile.abstained || {};
    const disabledQuestions = new Set(profile.disabledQuestions || []);
    
    profile.questionMeta.forEach(meta => {
      // Build label using position number (e.g., "Q3", "Q3a", "Q12b")
      let label = 'Q' + meta.num;
      if (meta.subLetter) {
        label += meta.subLetter;
      }
      
      const hasAnswer = answers[meta.id] && answers[meta.id].length > 0;
      const isAbstained = abstained[meta.id];
      const isDisabled = disabledQuestions.has(meta.id);
      
      if (!hasAnswer && !isAbstained && !isDisabled) {
        if (!grouped[meta.category]) grouped[meta.category] = {};
        if (!grouped[meta.category][meta.subcategory]) grouped[meta.category][meta.subcategory] = [];
        const key = label + ': Not answered';
        if (!grouped[meta.category][meta.subcategory].some(p => p.key === key)) {
          grouped[meta.category][meta.subcategory].push({ key: key });
        }
      }
    });
  }

  let html = `<div class="cr-header"><h1>What You Stand For</h1><p>${escapeHtml(profile.label)}</p></div><div class="cr-columns">`;
  catOrder.forEach(cat => {
    const data = grouped[cat] || {};
    const subs = Object.keys(data);
    html += `<div class="cr-category ${catCss[cat]}"><div class="cr-category-header">${cat}</div><div class="cr-category-body">`;
    if (subs.length === 0) { html += `<div class="cr-empty">No policies selected</div>`; }
    else { subs.forEach(sub => {
      html += `<div class="cr-sub"><div class="cr-sub-title">${sub}</div>`;
      
      // Group policies by prefix
      const grouped = {};
      const noPrefix = [];
      
      data[sub].forEach(p => {
        const colonIndex = p.key.indexOf(':');
        if (colonIndex > 0) {
          const prefix = p.key.substring(0, colonIndex);
          const value = p.key.substring(colonIndex + 1).trim();
          if (!grouped[prefix]) grouped[prefix] = [];
          grouped[prefix].push(value);
        } else {
          noPrefix.push(p.key);
        }
      });
      
      // Render grouped policies
      Object.keys(grouped).forEach(prefix => {
        const values = grouped[prefix];
        html += `<div class="cr-policy">${prefix}: ${values.join(', ')}</div>`;
      });
      
      // Render non-prefixed policies
      noPrefix.forEach(key => {
        html += `<div class="cr-policy">${key}</div>`;
      });
      
      html += `</div>`;
    }); }
    html += `</div></div>`;
  });
  html += `</div><div class="cr-footer">What You Stand For — A Detailed Policy Assessment</div>`;
  el.innerHTML = html;

  // Apply current page theme to compact results
  const cs2 = getComputedStyle(document.documentElement);
  el.querySelector('.cr-header').style.borderTopColor = cs2.getPropertyValue('--border').trim();
  el.querySelector('.cr-header').style.borderBottomColor = cs2.getPropertyValue('--border').trim();
  if (el.querySelector('.cr-header p')) el.querySelector('.cr-header p').style.color = cs2.getPropertyValue('--text-light').trim();
  el.querySelectorAll('.cr-category').forEach(c => {
    const h = c.querySelector('.cr-category-header');
    if (c.classList.contains('cr-cat-gov')) h.style.background = cs2.getPropertyValue('--cat-governance').trim();
    if (c.classList.contains('cr-cat-eco')) h.style.background = cs2.getPropertyValue('--cat-economy').trim();
    if (c.classList.contains('cr-cat-wor')) h.style.background = cs2.getPropertyValue('--cat-world').trim();
    if (c.classList.contains('cr-cat-cul')) h.style.background = cs2.getPropertyValue('--cat-culture').trim();
  });
  el.querySelectorAll('.cr-category-body').forEach(b => { b.style.background = cs2.getPropertyValue('--card-bg').trim(); b.style.borderColor = cs2.getPropertyValue('--border-light').trim(); });
  el.querySelectorAll('.cr-sub-title').forEach(t => { t.style.color = cs2.getPropertyValue('--text').trim(); t.style.borderBottomColor = cs2.getPropertyValue('--border-light').trim(); });
  el.querySelectorAll('.cr-policy').forEach(p => p.style.color = cs2.getPropertyValue('--text-light').trim());
  el.querySelectorAll('.cr-empty').forEach(p => p.style.color = cs2.getPropertyValue('--text-light').trim());
  el.querySelector('.cr-footer').style.borderTopColor = cs2.getPropertyValue('--border').trim();
  el.querySelector('.cr-footer').style.color = cs2.getPropertyValue('--text-light').trim();
  el.style.background = cs2.getPropertyValue('--bg').trim();
  el.style.color = cs2.getPropertyValue('--text').trim();

  // Reset theme and quality selectors
  const themeSel = document.getElementById('image-theme-select');
  if (themeSel) themeSel.value = 'current';
  const qualitySel = document.getElementById('image-quality-select');
  const scale = qualitySel ? parseFloat(qualitySel.value) : 2;

  setTimeout(() => {
    if (typeof html2canvas === 'undefined') {
      document.getElementById('results-image-section').style.display = 'none';
      return;
    }
    html2canvas(el, { scale: scale, backgroundColor: el.style.background || '#f5f0e8', useCORS: true }).then(canvas => {
      const imgData = canvas.toDataURL('image/png');
      document.getElementById('results-image').src = imgData;
      const btn = document.getElementById('btn-download-image');
      btn.href = imgData;
      btn.download = `political-spectrum-${profile.label.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.png`;
    }).catch(() => {
      document.getElementById('results-image-section').style.display = 'none';
    });
  }, 100);
}

// ========== DELETE ==========
function deleteProfile(index) {
  if (!confirm('Delete "' + profiles[index].label + '"? This cannot be undone.')) return;
  profiles.splice(index, 1);
  localStorage.setItem('politicalSpectrumProfiles', JSON.stringify(profiles));
  showListView();
}

// ========== EDIT ==========
function editProfile(index) {
  const profile = profiles[index];
  localStorage.setItem('politicalSpectrumResume', JSON.stringify({
    answers: profile.answers,
    abstained: profile.abstained || {}
  }));
  window.location.href = 'what-you-stand-for.html';
}

// ========== NAVIGATION ==========
function showListView() {
  document.getElementById('list-view').style.display = 'block';
  document.getElementById('detail-view').style.display = 'none';
  document.getElementById('compare-view').style.display = 'none';
  renderList();
}

// ========== COMPARE ==========
function compareProfiles() {
  const aIdx = parseInt(document.getElementById('compare-a').value);
  const bIdx = parseInt(document.getElementById('compare-b').value);
  if (aIdx === bIdx) { alert('Please select two different profiles.'); return; }

  document.getElementById('list-view').style.display = 'none';
  document.getElementById('detail-view').style.display = 'none';
  document.getElementById('compare-view').style.display = 'block';

  loadPoliciesDB().then(db => {
    // Also merge resolvedPolicies from the two profiles being compared
    const compareDb = { ...db };
    if (profiles[aIdx].resolvedPolicies) Object.assign(compareDb, profiles[aIdx].resolvedPolicies);
    if (profiles[bIdx].resolvedPolicies) Object.assign(compareDb, profiles[bIdx].resolvedPolicies);

    const aPolicies = getPoliciesSet(profiles[aIdx].answers);
    const bPolicies = getPoliciesSet(profiles[bIdx].answers);

    // Also include abstained entries from both profiles
    const aAbstained = profiles[aIdx].abstainedSubcategories || [];
    const bAbstained = profiles[bIdx].abstainedSubcategories || [];

    const allKeys = [...new Set([...aPolicies, ...bPolicies])];
    const grouped = {};
    allKeys.forEach(key => {
      const p = compareDb[key];
      if (!p) return;
      if (!grouped[p.category]) grouped[p.category] = {};
      if (!grouped[p.category][p.subcategory]) grouped[p.category][p.subcategory] = [];
      grouped[p.category][p.subcategory].push({
        key, inA: aPolicies.includes(key), inB: bPolicies.includes(key), description: p.description
      });
    });

    // Add abstained entries
    const allAbstained = [...aAbstained.map(a => ({ ...a, source: 'a' })), ...bAbstained.map(a => ({ ...a, source: 'b' }))];
    allAbstained.forEach(a => {
      if (!grouped[a.category]) grouped[a.category] = {};
      if (!grouped[a.category][a.subcategory]) grouped[a.category][a.subcategory] = [];
      const exists = grouped[a.category][a.subcategory].some(p => p.key === a.key);
      if (!exists) {
        const inA = aAbstained.some(x => x.key === a.key);
        const inB = bAbstained.some(x => x.key === a.key);
        grouped[a.category][a.subcategory].push({
          key: a.key, inA, inB, description: a.description || 'Abstained from answering.'
        });
      }
    });

    const catOrder = ["Governance", "Economy", "World", "Culture & Social Issues"];
    const catCss = { "Governance": "results-cat-governance", "Economy": "results-cat-economy", "World": "results-cat-world", "Culture & Social Issues": "results-cat-culture" };

    let html = `
      <div class="results-header">
        <h2>Comparing Profiles</h2>
        <p style="font-size: 0.9em; color: var(--text-light);">
          <span style="color: var(--cat-governance); font-weight: 700;">● ${escapeHtml(profiles[aIdx].label)}</span>
          &nbsp;vs&nbsp;
          <span style="color: var(--accent); font-weight: 700;">● ${escapeHtml(profiles[bIdx].label)}</span>
        </p>
        <p style="font-size: 0.8em; color: var(--text-light); margin-top: 8px;">
          <span style="background: #d4edda; padding: 2px 8px;">Both agree</span>
          <span style="background: #cce5ff; padding: 2px 8px; margin-left: 5px;">Only A</span>
          <span style="background: #f8d7da; padding: 2px 8px; margin-left: 5px;">Only B</span>
        </p>
      </div>`;

    catOrder.forEach(catName => {
      const catData = grouped[catName] || {};
      const subs = Object.keys(catData);
      html += `<div class="results-category ${catCss[catName]}"><div class="results-category-header">${catName}</div><div class="results-category-body">`;
      if (subs.length === 0) { html += `<div class="no-policies">No policies in common.</div>`; }
      else {
        subs.forEach(sub => {
          html += `<div class="results-subcategory"><div class="results-subcategory-title">${sub}</div>`;
          catData[sub].forEach(p => {
            let bgColor = 'white', tag = '';
            if (p.inA && p.inB) { bgColor = '#d4edda'; tag = '✓ Both'; }
            else if (p.inA) { bgColor = '#cce5ff'; tag = '← A only'; }
            else { bgColor = '#f8d7da'; tag = '→ B only'; }
            html += `<div class="policy-card" style="background: ${bgColor};" onclick="this.classList.toggle('open')">
              <div class="policy-card-header">
                <div class="policy-symbol">⬡</div>
                <div class="policy-name">${p.key} <span style="font-weight: 400; font-size: 0.8em; color: var(--text-light);">${tag}</span></div>
                <div class="policy-arrow">▼</div>
              </div>
              <div class="policy-description">${p.description}</div>
            </div>`;
          });
          html += `</div>`;
        });
      }
      html += `</div></div>`;
    });

    document.getElementById('compare-content').innerHTML = html;
    window.scrollTo(0, 0);
  });
}

function getPoliciesSet(answers) {
  let all = [];
  Object.values(answers).forEach(p => { if (Array.isArray(p)) all.push(...p); });
  return [...new Set(all)];
}
