// Encoding/Decoding Functions
function encodeProfile(profile) {
  // 1. Encode policy keys using dictionary
  const encodedAnswers = {};
  for (const [qId, policies] of Object.entries(profile.answers)) {
    encodedAnswers[qId] = policies.map(p => REVERSE_POLICY_DICT[p] || p);
  }
  
  // 2. Convert abstained object to array (compact representation)
  const abstainedArray = Object.keys(profile.abstained || {}).map(Number);
  
  // 3. Use Unix timestamp (seconds instead of ISO string)
  const timestamp = Math.floor(new Date(profile.timestamp).getTime() / 1000);
  
  // 4. Create compact profile
  const compact = {
    l: profile.label,
    t: timestamp,
    a: encodedAnswers,
    b: abstainedArray
  };
  
  // 5. Compress with LZ-string
  return LZString.compressToUTF16(JSON.stringify(compact));
}

function decodeProfile(compressed) {
  // 1. Decompress
  const json = LZString.decompressFromUTF16(compressed);
  if (!json) return null;
  
  const compact = JSON.parse(json);
  
  // 2. Decode policy keys
  const answers = {};
  for (const [qId, codes] of Object.entries(compact.a)) {
    answers[qId] = codes.map(c => POLICY_DICT[c] || c);
  }
  
  // 3. Convert abstained array back to object
  const abstained = {};
  (compact.b || []).forEach(id => { abstained[id] = true; });
  
  // 4. Convert Unix timestamp back to ISO string
  const timestamp = new Date(compact.t * 1000).toISOString();
  
  return {
    label: compact.l,
    timestamp: timestamp,
    answers: answers,
    abstained: abstained
  };
}

function isCompressedProfile(data) {
  return typeof data === 'string' && data.length > 0;
}

// Helper function to save profiles to localStorage
function saveProfilesToStorage() {
  // Save profiles as-is (don't compress in editor to preserve derived fields)
  localStorage.setItem('politicalSpectrumProfiles', JSON.stringify(profiles));
}

<script>

let profiles = [];
let selectedIndex = -1;

function init() {
  try { 
    const stored = JSON.parse(localStorage.getItem('politicalSpectrumProfiles') || '[]');
    // Decode compressed profiles, keep old format as-is for backward compatibility
    profiles = stored.map(p => {
      if (isCompressedProfile(p)) {
        const decoded = decodeProfile(p);
        return decoded || p; // Fallback to original if decode fails
      }
      return p; // Old format, return as-is
    });
  }
  catch(e) { profiles = []; }
  renderList();
}

function renderList() {
  const list = document.getElementById('profile-list');
  const importSection = document.getElementById('import-section');
  importSection.style.display = profiles.length > 0 ? 'block' : 'block';

  if (profiles.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <h2>No Saved Profiles Yet</h2>
        <p>Complete the quiz and save your results to see them here.</p>
        <a href="what-you-stand-for.html" class="btn btn-view" style="text-decoration: none;">Take the Quiz</a>
      </div>`;
    return;
  }

  let html = '';

  // Separate in_progress and completed profiles
  const inProgressProfiles = [];
  const completedProfiles = [];
  
  profiles.forEach((p, i) => {
    if (p.status === 'in_progress') {
      inProgressProfiles.push({ profile: p, originalIndex: i });
    } else {
      completedProfiles.push({ profile: p, originalIndex: i });
    }
  });

  // Compare section (only for completed profiles)
  if (completedProfiles.length >= 2) {
    html += `<div class="compare-section">
      <h3>Compare Two Profiles</h3>
      <select class="compare-select" id="compare-a">`;
    completedProfiles.forEach((p, i) => { html += `<option value="${p.originalIndex}">${p.profile.label} (${formatDate(p.profile.timestamp)})</option>`; });
    html += `</select> vs <select class="compare-select" id="compare-b">`;
    completedProfiles.forEach((p, i) => { html += `<option value="${p.originalIndex}"${i === 1 ? ' selected' : ''}>${p.profile.label} (${formatDate(p.profile.timestamp)})</option>`; });
    html += `</select> <button class="btn btn-view" onclick="compareProfiles()">Compare</button></div>`;
  }

  // Show in_progress profiles first (pinned to top)
  if (inProgressProfiles.length > 0) {
    html += `<div class="in-progress-section">
      <h3 style="margin-bottom: 15px; color: var(--accent);">🔄 In Progress</h3>`;
    
    inProgressProfiles.forEach(({ profile, originalIndex }) => {
      const policyCount = countPolicies(profile.answers);
      const currentQ = profile.currentQuestion !== undefined ? ` (Question ${profile.currentQuestion + 1})` : '';
      html += `
        <div class="profile-card" style="border-left: 4px solid var(--accent); background: rgba(139, 0, 0, 0.05);">
          <div class="profile-info">
            <div class="profile-name">${escapeHtml(profile.label)}${currentQ}</div>
            <div class="profile-date">${formatDate(profile.timestamp)}</div>
            <div class="profile-count">${policyCount} policies selected</div>
            <div class="profile-status" style="color: var(--accent); font-weight: 600; font-size: 0.85em; margin-top: 5px;">⚠️ In Progress - Not yet completed</div>
          </div>
          <div class="profile-actions">
            <button class="btn btn-export" onclick="exportProfile(${originalIndex})">Export</button>
            <button class="btn btn-edit" onclick="editProfile(${originalIndex})">Edit</button>
            <button class="btn btn-delete" onclick="deleteProfile(${originalIndex})">Delete</button>
          </div>
        </div>`;
    });
    
    html += `</div>`;
  }

  // Show completed profiles
  if (completedProfiles.length > 0) {
    if (inProgressProfiles.length > 0) {
      html += `<h3 style="margin: 25px 0 15px 0;">Completed Profiles</h3>`;
    }
    
    completedProfiles.forEach(({ profile, originalIndex }) => {
      const policyCount = countPolicies(profile.answers);
      html += `
        <div class="profile-card">
          <div class="profile-info">
            <div class="profile-name">${escapeHtml(profile.label)}</div>
            <div class="profile-date">${formatDate(profile.timestamp)}</div>
            <div class="profile-count">${policyCount} policies selected</div>
          </div>
          <div class="profile-actions">
            <button class="btn btn-export" onclick="exportProfile(${originalIndex})">Export</button>
            <button class="btn btn-view" onclick="viewProfile(${originalIndex})">View</button>
            <button class="btn btn-edit" onclick="editProfile(${originalIndex})">Edit</button>
            <button class="btn btn-delete" onclick="deleteProfile(${originalIndex})">Delete</button>
          </div>
        </div>`;
    });
  }

  list.innerHTML = html;
}

function countPolicies(answers) {
  let count = 0;
  Object.values(answers).forEach(p => { if (Array.isArray(p)) count += p.length; });
  return count;
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ========== EXPORT ==========
function exportProfile(index) {
  const profile = profiles[index];
  // Export as compressed format
  const compressed = encodeProfile(profile);
  const data = JSON.stringify(compressed);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeName = profile.label.replace(/[^a-z0-9]/gi, '_').toLowerCase();
  const date = new Date(profile.timestamp).toISOString().slice(0, 10);
  a.href = url;
  a.download = `political-spectrum-${safeName}-${date}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ========== IMPORT ==========
function handleImport(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      
      // Check if it's a compressed profile (string) or old format (object)
      let profile;
      if (typeof imported === 'string') {
        // Compressed format - decode it
        profile = decodeProfile(imported);
        if (!profile) {
          alert('Failed to decode compressed profile.');
          return;
        }
      } else {
        // Old uncompressed format - validate structure
        if (!imported.label || !imported.answers || !imported.timestamp) {
          alert('Invalid profile file. Missing required fields (label, answers, timestamp).');
          return;
        }
        profile = imported;
      }
      
      // Add to profiles
      profiles.push(profile);
      saveProfilesToStorage();
      renderList();
      alert('Profile "' + profile.label + '" imported successfully!');
    } catch(err) {
      alert('Failed to parse file. Make sure it is a valid exported profile (.json).');
    }
  };
  reader.readAsText(file);
  // Reset input so same file can be imported again
  event.target.value = '';
}

// ========== VIEW ==========
function viewProfile(index) {
  selectedIndex = index;
  const profile = profiles[index];

  document.getElementById('list-view').style.display = 'none';
  document.getElementById('compare-view').style.display = 'none';
  document.getElementById('detail-view').style.display = 'block';

  document.getElementById('detail-delete-btn').onclick = function() { deleteProfile(index); };

  const db = profile.resolvedPolicies || policiesDB;
  
  renderProfileResults(profile, db);
}

function loadPoliciesDB() {
  const merged = {};
  // For backward compatibility, merge resolvedPolicies from old profiles
  profiles.forEach(p => { if (p.resolvedPolicies) Object.assign(merged, p.resolvedPolicies); });
  if (Object.keys(merged).length === 0) Object.assign(merged, policiesDB);
  return Promise.resolve(merged);
}

// Helper function to resolve policies from answers (for new optimized profiles)
function resolvePoliciesFromAnswers(answers) {
  const resolved = {};
  let allPolicyKeys = [];
  Object.values(answers).forEach(p => { if (Array.isArray(p)) allPolicyKeys.push(...p); });
  allPolicyKeys = [...new Set(allPolicyKeys)];
  allPolicyKeys.forEach(key => {
    if (policiesDB[key]) {
      resolved[key] = policiesDB[key];
    }
  });
  return resolved;
}

// Helper function to build abstained subcategories (for new optimized profiles)
function buildAbstainedSubcategories(abstained) {
  // If questions array is not available, return empty array
  if (typeof questions === 'undefined') {
    console.warn('questions array not defined, cannot build abstained subcategories');
    return [];
  }
  
  const abstainedSubcategories = [];
  const idToMeta = {};
  questions.forEach(q => {
    if (q.type === 'double') {
      q.questions.forEach(sub => { idToMeta[sub.subId] = { category: q.category, subcategory: q.subcategory, text: sub.text }; });
    } else if (q.id !== 0) {
      idToMeta[q.id] = { category: q.category, subcategory: q.subcategory, text: q.text };
    }
  });
  Object.keys(abstained).forEach(id => {
    if (!abstained[id]) return;
    const meta = idToMeta[id];
    if (!meta) return;
    const key = 'Abstained: ' + meta.text;
    if (!abstainedSubcategories.some(a => a.key === key)) {
      abstainedSubcategories.push({
        key: key,
        category: meta.category,
        subcategory: meta.subcategory,
        description: 'You chose to abstain from answering this question.'
      });
    }
  });
  return abstainedSubcategories;
}

// Helper function to build question metadata (for new optimized profiles)
function buildQuestionMeta() {
  // If questions array is not available, return empty array
  if (typeof questions === 'undefined') {
    console.warn('questions array not defined, cannot build question metadata');
    return [];
  }
  
  const questionMeta = [];
  let qNum = 0;
  questions.forEach(q => {
    if (q.type === 'intro') return;
    qNum++;
    if (q.type === 'double') {
      q.questions.forEach((sub, idx) => {
        questionMeta.push({ 
          id: sub.subId, 
          category: q.category, 
          subcategory: q.subcategory,
          num: qNum,
          subLetter: String.fromCharCode(97 + idx)
        });
      });
    } else {
      questionMeta.push({ 
        id: q.id, 
        category: q.category, 
        subcategory: q.subcategory,
        num: qNum
      });
    }
  });
  return questionMeta;
}

// Helper function to calculate disabled questions (for new optimized profiles)
function calculateDisabledQuestions(answers) {
  // If questions array is not available, return empty set
  if (typeof questions === 'undefined') {
    console.warn('questions array not defined, cannot calculate disabled questions');
    return new Set();
  }
  
  const disabled = new Set();
  
  questions.forEach(q => {
    if (q.type === 'intro') return;
    
    // Check cross-question disabling
    if (q.disablesQuestions) {
      const dq = q.disablesQuestions;
      const triggerAnswers = dq.subId ? (answers[dq.subId] || []) : (answers[q.id] || []);
      let triggered = false;
      
      if (dq.optionIndex !== undefined) {
        const triggerSub = dq.subId ? q.questions.find(s => s.subId === dq.subId) : null;
        const triggerOpt = triggerSub ? triggerSub.options[dq.optionIndex] : q.options[dq.optionIndex];
        if (triggerOpt && triggerOpt.policies.every(p => triggerAnswers.includes(p))) triggered = true;
      }
      if (dq.optionIndices) {
        dq.optionIndices.forEach(idx => {
          const triggerSub = dq.subId ? q.questions.find(s => s.subId === dq.subId) : null;
          const triggerOpt = triggerSub ? triggerSub.options[idx] : q.options[idx];
          if (triggerOpt && triggerOpt.policies.every(p => triggerAnswers.includes(p))) triggered = true;
        });
      }
      
      if (triggered) {
        dq.targets.forEach(targetId => disabled.add(targetId));
      }
    }
    
    // Check disablesOtherParts (within double questions)
    if (q.type === 'double' && q.disablesOtherParts) {
      const dp = q.disablesOtherParts;
      const triggeringAnswers = answers[dp.subId] || [];
      const triggeringSub = q.questions.find(s => s.subId === dp.subId);
      
      if (triggeringSub) {
        let isTriggered = false;
        
        if (dp.optionIndex !== undefined) {
          const triggerPolicies = triggeringSub.options[dp.optionIndex].policies;
          if (triggerPolicies.every(p => triggeringAnswers.includes(p))) isTriggered = true;
        }
        if (dp.optionIndices) {
          dp.optionIndices.forEach(idx => {
            const triggerPolicies = triggeringSub.options[idx].policies;
            if (triggerPolicies.every(p => triggeringAnswers.includes(p))) isTriggered = true;
          });
        }
        
        if (isTriggered) {
          dp.targets.forEach(targetSubId => disabled.add(targetSubId));
        }
      }
    }
    
    // Check conditionalDisable (multiple conditions with AND logic)
    if (q.type === 'double' && q.conditionalDisable) {
      const cd = q.conditionalDisable;
      let allConditionsMet = true;
      
      cd.conditions.forEach(condition => {
        const conditionAnswers = answers[condition.subId] || [];
        const conditionSub = q.questions.find(s => s.subId === condition.subId);
        
        if (conditionSub) {
          const triggerPolicies = conditionSub.options[condition.optionIndex].policies;
          if (!triggerPolicies.every(p => conditionAnswers.includes(p))) {
            allConditionsMet = false;
          }
        } else {
          allConditionsMet = false;
        }
      });
      
      if (allConditionsMet) {
        cd.targets.forEach(targetSubId => disabled.add(targetSubId));
      }
    }
  });
  
  return disabled;
}

let lastEditorGrouped = null;
let lastEditorProfile = null;



function rerenderEditorImage(themeName) {
  const el = document.getElementById('compact-results');
  applyThemeToCompact(el, themeName);
  const qualitySelect = document.getElementById('image-quality-select');
  const scale = qualitySelect ? parseFloat(qualitySelect.value) : 2;
  setTimeout(() => {
    renderCompactImage(el, scale, 'political-spectrum-' + (lastEditorProfile ? lastEditorProfile.label : 'results').replace(/[^a-z0-9]/gi, '_').toLowerCase() + '.png').then(({ imgData }) => {
      document.getElementById('results-image').src = imgData;
      const btn = document.getElementById('btn-download-image');
      btn.href = imgData;
      btn.download = 'political-spectrum-' + (lastEditorProfile ? lastEditorProfile.label : 'results').replace(/[^a-z0-9]/gi, '_').toLowerCase() + '.png';
    });
  }, 100);
}

function generateProfileImage(profile, grouped) {
  lastEditorProfile = profile;
  lastEditorGrouped = grouped;
  const el = document.getElementById('compact-results');
  const catOrder = ["Governance", "Economy", "World", "Culture & Social Issues"];
  const catCss = { "Governance": "cr-cat-gov", "Economy": "cr-cat-eco", "World": "cr-cat-wor", "Culture & Social Issues": "cr-cat-cul" };

  // Add abstained subcategories to grouped (for image)
  // For backward compatibility: use stored abstainedSubcategories if available, otherwise calculate
  const abstainedSubcategories = profile.abstainedSubcategories || buildAbstainedSubcategories(profile.abstained || {});
  abstainedSubcategories.forEach(a => {
    if (!grouped[a.category]) grouped[a.category] = {};
    if (!grouped[a.category][a.subcategory]) grouped[a.category][a.subcategory] = [];
    if (!grouped[a.category][a.subcategory].some(p => p.key === a.key)) {
      grouped[a.category][a.subcategory].push({ key: a.key });
    }
  });

  // Add "Not answered" for questions without answers AND not abstained (image only)
  // For backward compatibility: use stored questionMeta if available, otherwise calculate
  const questionMeta = profile.questionMeta || buildQuestionMeta();
  const answers = profile.answers || {};
  const abstained = profile.abstained || {};
  
  // Calculate disabled questions on-the-fly
  const disabledQuestions = calculateDisabledQuestions(answers);
  
  questionMeta.forEach(meta => {
    // Build label using position number (e.g., "Q3", "Q3a", "Q12b")
    let label = 'Q' + meta.num;
    if (meta.subLetter) {
      label += meta.subLetter;
    }
    
    const hasAnswer = answers[meta.id] && answers[meta.id].length > 0;
    const isAbstained = abstained[meta.id];
    const isDisabled = disabledQuestions.has(meta.id);
    
    if (!hasAnswer && !isAbstained && !isDisabled) {
      if (!grouped[meta.category]) grouped[meta.category] = {};
      if (!grouped[meta.category][meta.subcategory]) grouped[meta.category][meta.subcategory] = [];
      const key = label + ': Not answered';
      if (!grouped[meta.category][meta.subcategory].some(p => p.key === key)) {
        grouped[meta.category][meta.subcategory].push({ key: key });
      }
    }
  });

  el.innerHTML = buildCompactResultsHTML(grouped, escapeHtml(profile.label));

  // Apply current page theme to compact results
  const cs2 = getComputedStyle(document.documentElement);
  el.querySelector('.cr-header').style.borderTopColor = cs2.getPropertyValue('--border').trim();
  el.querySelector('.cr-header').style.borderBottomColor = cs2.getPropertyValue('--border').trim();
  if (el.querySelector('.cr-header p')) el.querySelector('.cr-header p').style.color = cs2.getPropertyValue('--text-light').trim();
  el.querySelectorAll('.cr-category').forEach(c => {
    const h = c.querySelector('.cr-category-header');
    if (c.classList.contains('cr-cat-gov')) h.style.background = cs2.getPropertyValue('--cat-governance').trim();
    if (c.classList.contains('cr-cat-eco')) h.style.background = cs2.getPropertyValue('--cat-economy').trim();
    if (c.classList.contains('cr-cat-wor')) h.style.background = cs2.getPropertyValue('--cat-world').trim();
    if (c.classList.contains('cr-cat-cul')) h.style.background = cs2.getPropertyValue('--cat-culture').trim();
  });
  el.querySelectorAll('.cr-category-body').forEach(b => { b.style.background = cs2.getPropertyValue('--card-bg').trim(); b.style.borderColor = cs2.getPropertyValue('--border-light').trim(); });
  el.querySelectorAll('.cr-sub-title').forEach(t => { t.style.color = cs2.getPropertyValue('--text').trim(); t.style.borderBottomColor = cs2.getPropertyValue('--border-light').trim(); });
  el.querySelectorAll('.cr-policy').forEach(p => p.style.color = cs2.getPropertyValue('--text-light').trim());
  el.querySelectorAll('.cr-empty').forEach(p => p.style.color = cs2.getPropertyValue('--text-light').trim());
  el.querySelector('.cr-footer').style.borderTopColor = cs2.getPropertyValue('--border').trim();
  el.querySelector('.cr-footer').style.color = cs2.getPropertyValue('--text-light').trim();
  el.style.background = cs2.getPropertyValue('--bg').trim();
  el.style.color = cs2.getPropertyValue('--text').trim();

  // Reset theme and quality selectors
  const themeSel = document.getElementById('image-theme-select');
  if (themeSel) themeSel.value = 'current';
  const qualitySel = document.getElementById('image-quality-select');
  const scale = qualitySel ? parseFloat(qualitySel.value) : 2;

  setTimeout(() => {
    if (typeof html2canvas === 'undefined') {
      document.getElementById('results-image-section').style.display = 'none';
      return;
    }
    renderCompactImage(el, scale, 'political-spectrum-' + profile.label.replace(/[^a-z0-9]/gi, '_').toLowerCase() + '.png').then(({ imgData }) => {
      document.getElementById('results-image').src = imgData;
      const btn = document.getElementById('btn-download-image');
      btn.href = imgData;
      btn.download = 'political-spectrum-' + profile.label.replace(/[^a-z0-9]/gi, '_').toLowerCase() + '.png';
    }).catch(() => {
      document.getElementById('results-image-section').style.display = 'none';
    });
  }, 100);
}

// ========== DELETE ==========
function deleteProfile(index) {
  if (!confirm('Delete "' + profiles[index].label + '"? This cannot be undone.')) return;
  profiles.splice(index, 1);
  saveProfilesToStorage();
  showListView();
}

// ========== EDIT ==========
function editProfile(index) {
  const profile = profiles[index];
  localStorage.setItem('politicalSpectrumResume', JSON.stringify({
    answers: profile.answers,
    abstained: profile.abstained || {}
  }));
  window.location.href = 'what-you-stand-for.html';
}

// ========== NAVIGATION ==========
function showListView() {
  document.getElementById('list-view').style.display = 'block';
  document.getElementById('detail-view').style.display = 'none';
  document.getElementById('compare-view').style.display = 'none';
  renderList();
}

// ========== COMPARE ==========
function compareProfiles() {
  const aIdx = parseInt(document.getElementById('compare-a').value);
  const bIdx = parseInt(document.getElementById('compare-b').value);
  if (aIdx === bIdx) { alert('Please select two different profiles.'); return; }

  document.getElementById('list-view').style.display = 'none';
  document.getElementById('detail-view').style.display = 'none';
  document.getElementById('compare-view').style.display = 'block';

  loadPoliciesDB().then(db => {
    // Also merge resolvedPolicies from the two profiles being compared (for backward compatibility)
    const compareDb = { ...db };
    if (profiles[aIdx].resolvedPolicies) Object.assign(compareDb, profiles[aIdx].resolvedPolicies);
    if (profiles[bIdx].resolvedPolicies) Object.assign(compareDb, profiles[bIdx].resolvedPolicies);

    const aPolicies = getPoliciesSet(profiles[aIdx].answers);
    const bPolicies = getPoliciesSet(profiles[bIdx].answers);

    // Also include abstained entries from both profiles
    // For backward compatibility: use stored abstainedSubcategories if available, otherwise calculate
    const aAbstained = profiles[aIdx].abstainedSubcategories || buildAbstainedSubcategories(profiles[aIdx].abstained || {});
    const bAbstained = profiles[bIdx].abstainedSubcategories || buildAbstainedSubcategories(profiles[bIdx].abstained || {});

    const allKeys = [...new Set([...aPolicies, ...bPolicies])];
    const grouped = {};
    allKeys.forEach(key => {
      const p = compareDb[key];
      if (!p) return;
      if (!grouped[p.category]) grouped[p.category] = {};
      if (!grouped[p.category][p.subcategory]) grouped[p.category][p.subcategory] = [];
      grouped[p.category][p.subcategory].push({
        key, inA: aPolicies.includes(key), inB: bPolicies.includes(key), description: p.description
      });
    });

    // Add abstained entries
    const allAbstained = [...aAbstained.map(a => ({ ...a, source: 'a' })), ...bAbstained.map(a => ({ ...a, source: 'b' }))];
    allAbstained.forEach(a => {
      if (!grouped[a.category]) grouped[a.category] = {};
      if (!grouped[a.category][a.subcategory]) grouped[a.category][a.subcategory] = [];
      const exists = grouped[a.category][a.subcategory].some(p => p.key === a.key);
      if (!exists) {
        const inA = aAbstained.some(x => x.key === a.key);
        const inB = bAbstained.some(x => x.key === a.key);
        grouped[a.category][a.subcategory].push({
          key: a.key, inA, inB, description: a.description || 'Abstained from answering.'
        });
      }
    });

    const catOrder = ["Governance", "Economy", "World", "Culture & Social Issues"];
    const catCss = { "Governance": "results-cat-governance", "Economy": "results-cat-economy", "World": "results-cat-world", "Culture & Social Issues": "results-cat-culture" };

    let html = `
      <div class="results-header">
        <h2>Comparing Profiles</h2>
        <p style="font-size: 0.9em; color: var(--text-light);">
          <span style="color: var(--cat-governance); font-weight: 700;">● ${escapeHtml(profiles[aIdx].label)}</span>
          &nbsp;vs&nbsp;
          <span style="color: var(--accent); font-weight: 700;">● ${escapeHtml(profiles[bIdx].label)}</span>
        </p>
        <p style="font-size: 0.8em; color: var(--text-light); margin-top: 8px;">
          <span style="background: #d4edda; padding: 2px 8px;">Both agree</span>
          <span style="background: #cce5ff; padding: 2px 8px; margin-left: 5px;">Only A</span>
          <span style="background: #f8d7da; padding: 2px 8px; margin-left: 5px;">Only B</span>
        </p>
      </div>`;

    catOrder.forEach(catName => {
      const catData = grouped[catName] || {};
      const subs = Object.keys(catData);
      html += `<div class="results-category ${catCss[catName]}"><div class="results-category-header">${catName}</div><div class="results-category-body">`;
      if (subs.length === 0) { html += `<div class="no-policies">No policies in common.</div>`; }
      else {
        subs.forEach(sub => {
          html += `<div class="results-subcategory"><div class="results-subcategory-title">${sub}</div>`;
          catData[sub].forEach(p => {
            let bgColor = 'white', tag = '';
            if (p.inA && p.inB) { bgColor = '#d4edda'; tag = '✓ Both'; }
            else if (p.inA) { bgColor = '#cce5ff'; tag = '← A only'; }
            else { bgColor = '#f8d7da'; tag = '→ B only'; }
            html += `<div class="policy-card" style="background: ${bgColor};" onclick="this.classList.toggle('open')">
              <div class="policy-card-header">
                <div class="policy-symbol">⬡</div>
                <div class="policy-name">${p.key} <span style="font-weight: 400; font-size: 0.8em; color: var(--text-light);">${tag}</span></div>
                <div class="policy-arrow">▼</div>
              </div>
              <div class="policy-description">${p.description}</div>
            </div>`;
          });
          html += `</div>`;
        });
      }
      html += `</div></div>`;
    });

    document.getElementById('compare-content').innerHTML = html;
    window.scrollTo(0, 0);
  });
}

function getPoliciesSet(answers) {
  let all = [];
  Object.values(answers).forEach(p => { if (Array.isArray(p)) all.push(...p); });
  return [...new Set(all)];
}

function updateEditorFigureCount(count) {
  const settings = JSON.parse(localStorage.getItem('politicalSpectrumSettings') || '{}');
  settings.historicalFigureCount = count;
  localStorage.setItem('politicalSpectrumSettings', JSON.stringify(settings));
  if (selectedIndex !== null && profiles[selectedIndex]) {
    viewProfile(selectedIndex);
  }
}



init();
</script>

</html>
